<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who's Next</title>

<style>:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2320;--muted:#6b736e;--line:#dde1dc;--acc:#1f6b45;--accSoft:#e3f0e8;--warn:#a33b2b;--warnSoft:#f7e4e0}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2320;--ink:#eef1ee;--muted:#9aa39d;--line:#2e3631;--acc:#5cbf8a;--accSoft:#1f3329;--warn:#e88673;--warnSoft:#3a221d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif}
header{padding:16px;background:var(--acc);color:#fff}header h1{margin:0;font-size:20px}header p{margin:2px 0 0;opacity:.85;font-size:13px}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.pair{font-size:28px;font-weight:700}.pair span{color:var(--muted);font-weight:400}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.skipnote{background:var(--warnSoft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:10px}
input,button{font:inherit}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:8px}
button{border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
.primary{background:var(--acc);color:#fff;width:100%;margin-top:10px;font-weight:600}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.tog{min-width:76px;font-weight:600}.tog.in{background:var(--accSoft);color:var(--acc)}.tog.out{background:var(--warnSoft);color:var(--warn)}
.log .row{display:block}.log .when{font-size:13px;color:var(--muted)}.log .who{font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--warnSoft);color:var(--warn);margin-left:6px}
.hide{display:none}.err{color:var(--warn)}
.extras{display:flex;flex-direction:column;gap:6px;margin-top:12px}.extras label{display:flex;align-items:center;gap:8px;font-size:15px}.extras input{width:20px;height:20px;margin:0}
.btnlink{display:block;text-align:center;text-decoration:none;padding:12px 16px;border-radius:8px}
</style></head><body>
<header><h1>Who's Next</h1><p>LeafGuard Mobile crew rotation</p><p><a href="calendar.html" style="color:#fff;font-weight:600">Crew calendar →</a></p></header>
<main>
  <div class="card"><div class="label">Suggested next crew</div><div class="pair" id="pair">…</div><div id="skipnote"></div></div>
  <div class="card"><div class="label">Out right now</div><div id="outs" class="sub"></div></div>
  <div class="card log"><div class="label">Recent jobs</div><div id="logList"></div></div>
  <p class="sub" style="text-align:center">Updates automatically · <a href="calendar.html">Crew calendar</a></p>
</main>
<script>
const SUPABASE_URL = "https://nixyuazdwhyjwrbjivdp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5peHl1YXpkd2h5andyYmppdmRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTc0ODEsImV4cCI6MjEwNDM3MzQ4MX0.xOCe6qG37rTTQ7SaQra0BtF4Gbm_qbQMufUfqFBLEgs";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== ROTATION ENGINE (suggested crew, worked out from the job log) =====
const LEADS = ["Justus","David","Richard"];          // A, B, C
const HELPER_ORDER = ["Daryl","Darnez","Daniel"];    // A, B, C
const HELPER_ROUNDS = [[0,1,2],[1,2,0],[2,0,1]];     // A B C | B C A | C A B
const roleNames = r => r==='lead' ? LEADS : HELPER_ORDER;
const jobPeople = (j,r) => r==='lead' ? (j.leads||(j.lead?String(j.lead).split(' & '):[])) : (j.helpers||(j.helper?String(j.helper).split(' & '):[]));
function pdate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dkey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Working days a job covers: install date, then following days skipping Sundays
function workDays(start, days){
  if(!start) return [];
  const n=Math.max(1,Math.min(10,Number(days)||1)), out=[]; let d=pdate(start);
  while(out.length<n){ if(out.length===0 || d.getDay()!==0) out.push(dkey(d)); d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); }
  return out;
}
// Jobs since the last reset, each tagged with who was Out when it was assigned
function history(log){
  let out=new Set(), jobs=[];
  // Jobs count from when their crew was assigned (a job can sit on the calendar before it gets a crew)
  const ev=(log||[]).map((l,i)=>({l,i,t: l.type==='job' ? (l.assignedAt||l.id||0) : (l.id||0)}))
    .filter(e=>!(e.l.type==='job' && !jobPeople(e.l,'lead').length && !jobPeople(e.l,'helper').length));
  ev.sort((a,b)=> a.t-b.t || a.i-b.i);
  ev.map(e=>e.l).forEach(l=>{
    if(l.type==='reset'){ out=new Set(); jobs=[]; }
    else if(l.type==='out') out.add(l.name);
    else if(l.type==='in') out.delete(l.name);
    else if(l.type==='job') jobs.push({ j:l, out:[...out] });
  });
  return jobs;
}
function bookedOn(H, days){
  const set=new Set(); if(!days.length) return set;
  H.forEach(h=>{ const wd=workDays(h.j.installDate,h.j.days); if(wd.some(d=>days.includes(d))) [...jobPeople(h.j,'lead'),...jobPeople(h.j,'helper')].forEach(n=>set.add(n)); });
  return set;
}
// Who should get the next seat for a role. Even job counts come first.
//  3 available: rounds — everyone once per round, in round order (leads A B C; helpers A B C | B C A | C A B).
//  2 leads: alternate. 2 helpers: two in a row each (A A B B); whoever falls behind gets the next one(s) to catch up.
//  Only jobs assigned while the same people were available count, so an Out period pauses the main rotation.
function suggestRole(role, H, outNow, exclude, extra){
  const all=roleNames(role), avail=all.filter(n=>!outNow.includes(n));
  if(!avail.length) return { name:null, wanted:null };
  const key=avail.join('|');
  const mode=H.filter(h=>all.filter(n=>!h.out.includes(n)).join('|')===key).map(h=>jobPeople(h.j,role));
  (extra||[]).forEach(e=>mode.push(e));
  const cnt={}; avail.forEach(n=>cnt[n]=0);
  mode.forEach(ps=>ps.forEach(n=>{ if(n in cnt) cnt[n]++; }));
  let last=null;
  for(let i=mode.length-1;i>=0 && !last;i--){ const f=mode[i].filter(n=>n in cnt); if(f.length) last=f[f.length-1]; }
  if(!last){ for(let i=H.length-1;i>=0 && !last;i--){ const f=jobPeople(H[i].j,role).filter(n=>n in cnt); if(f.length) last=f[f.length-1]; } }
  let pref;
  if(avail.length>=3){
    const base=Math.min(...avail.map(n=>cnt[n]));
    const order= role==='lead' ? [0,1,2] : HELPER_ROUNDS[base%3];
    const pos=n=>order.indexOf(all.indexOf(n));
    pref=avail.slice().sort((a,b)=>cnt[a]-cnt[b] || pos(a)-pos(b));
  } else if(avail.length===2){
    const [a,b]=avail, other=n=>n===a?b:a; let first;
    if(role==='helper'){
      const d=cnt[a]-cnt[b];
      if(Math.abs(d)>=2) first = d>0?b:a;                         // behind by 2+: catch up
      else if(Math.abs(d)===1) first = last ? last : (d>0?b:a);    // mid-pair: same helper again
      else first = last ? other(last) : a;                          // even: switch
    } else {
      first = cnt[a]!==cnt[b] ? (cnt[a]<cnt[b]?a:b) : (last ? other(last) : a);
    }
    pref=[first, other(first)];
  } else pref=avail.slice();
  return { name: pref.find(n=>!exclude.has(n))||null, wanted: pref[0] };
}
// Full crew suggestion for a job with nl leads, nh helpers, on these work days
function suggestCrew(log, outNow, nl, nh, days){
  const H=history(log), booked=bookedOn(H, days||[]), notes=[];
  const pick=(role,n)=>{ const got=[];
    for(let i=0;i<n;i++){
      const r=suggestRole(role,H,outNow,new Set([...booked,...got]), got.length?[got.slice()]:[]);
      if(r.wanted && r.name!==r.wanted && booked.has(r.wanted) && !got.includes(r.wanted)) notes.push(`${r.wanted} already has a job that day`);
      if(r.name) got.push(r.name);
    } return got; };
  const leads=pick('lead',nl), helpers=pick('helper',nh);
  return { leads, helpers, ok: leads.length===nl && helpers.length===nh, notes };
}
// ===== END ROTATION ENGINE =====

let OUT = [], LOG = [];

async function loadAll(){
  const { data, error } = await db.from('settings').select('key,value').in('key',['rot2_state','rot2_out','rot2_log']);
  if (error) throw error;
  const m = {}; (data||[]).forEach(r => m[r.key] = r.value);
  try { if (m.rot2_out)   OUT = JSON.parse(m.rot2_out); } catch(e){}
  try { if (m.rot2_log)   LOG = JSON.parse(m.rot2_log); } catch(e){}
}
async function saveKey(key, obj){
  const value = JSON.stringify(obj);
  const { data } = await db.from('settings').select('id').eq('key', key);
  if (data && data.length) await db.from('settings').update({ value, updated_at:new Date().toISOString() }).eq('key', key);
  else await db.from('settings').insert({ key, value });
}

function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+m}/${+dd}/${y.slice(2)}`; }

const $=id=>document.getElementById(id);
function render(){
  const p = suggestCrew(LOG, OUT, 1, 1, []);
  $('pair').innerHTML = p.ok ? `${esc(p.leads[0])} <span>+</span> ${esc(p.helpers[0])}` : 'No one available';
  $('skipnote').innerHTML = '';
  $('outs').textContent = OUT.length ? OUT.join(', ') : 'Everyone is in';
  const jobs = LOG.filter(l=>l.type==='job' && ((l.leads&&l.leads.length)||l.lead)).sort((a,b)=>(a.assignedAt||a.id)-(b.assignedAt||b.id)).slice(-10).reverse();
  $('logList').innerHTML = jobs.length ? jobs.map(l=>`<div class="row"><div class="when">${fmtDate(l.date)}</div><div class="who">${l.n?'#'+l.n+' · ':''}${esc(l.lead)} + ${esc(l.helper)}</div></div>`).join('') : '<p class="sub">No jobs yet.</p>';
}
const go=()=>loadAll().then(render).catch(()=>{});
go(); setInterval(go,15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) go(); });
</script>

</body></html>
