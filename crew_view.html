<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mobile Crew Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f5f3; --surface: #ffffff; --surface-alt: #f9f9f8;
  --border: #e0dfd9; --border-strong: #c8c7c0;
  --text: #1a1a18; --text-secondary: #5a5a56; --text-muted: #9a9a94;
  --accent: #1d6fa4; --accent-bg: #e8f2f9; --accent-text: #155a85;
  --success: #1a6b3a; --success-bg: #e8f5ee;
  --warning: #92610a; --warning-bg: #fff8e1;
  --radius: 8px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; min-height: 100vh; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.25rem; }
header h1 { font-size: 17px; font-weight: 700; }
header .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.live { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--success); background: var(--success-bg); padding: 2px 8px; border-radius: 20px; margin-top: 4px; }
.live-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
nav { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; }
nav button { padding: 10px 16px; border: none; background: none; font-size: 13px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 480px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; }
.card-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
.month-label { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.readonly-notice { text-align: center; font-size: 10px; color: var(--text-muted); padding: 4px; border: 1px dashed var(--border-strong); border-radius: var(--radius); margin-top: 8px; }
.round-info { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
.round-badge { font-size: 11px; background: var(--accent-bg); color: var(--accent-text); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.queue-list { display: flex; flex-direction: column; gap: 5px; }
.queue-item { display: flex; align-items: center; gap: 8px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; }
.queue-item.up-next { background: var(--accent-bg); border-color: #a8cfe8; }
.queue-item.done { opacity: 0.6; }
.queue-pos { font-size: 11px; font-weight: 700; color: var(--text-muted); min-width: 18px; }
.queue-item.up-next .queue-pos { color: var(--accent); }
.queue-name { flex: 1; font-size: 14px; font-weight: 500; }
.queue-item.up-next .queue-name { color: var(--accent-text); font-weight: 600; }
.next-tag { font-size: 9px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
.done-tag { font-size: 9px; background: var(--success); color: #fff; padding: 1px 6px; border-radius: 3px; }
.skip-tag { font-size: 9px; background: var(--warning); color: #fff; padding: 1px 6px; border-radius: 3px; }
.totals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-cell { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; }
.stat-name { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; display: flex; align-items: center; gap: 4px; }
.role-badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: 500; }
.lead-badge { background: var(--accent-bg); color: var(--accent-text); }
.helper-badge { background: var(--success-bg); color: var(--success); }
.stat-amount { font-size: 17px; font-weight: 600; }
.stat-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.stat-avg { font-size: 11px; color: var(--accent-text); font-weight: 500; margin-top: 2px; }
.round-group { margin-bottom: 14px; }
.round-header { font-size: 12px; font-weight: 700; color: var(--text-secondary); background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 10px; margin-bottom: 5px; display: flex; justify-content: space-between; }
.round-entry { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.round-entry:last-child { border-bottom: none; }
.entry-name { font-weight: 600; min-width: 65px; }
.entry-action { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; margin-right: 4px; }
.action-assigned { background: var(--success-bg); color: var(--success); }
.action-skip { background: var(--warning-bg); color: var(--warning); }
.entry-detail { font-size: 11px; color: var(--text-muted); }
.job-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
.job-row:last-child { border-bottom: none; }
.job-top { display: flex; justify-content: space-between; align-items: flex-start; }
.job-name { font-size: 13px; font-weight: 600; }
.job-gross { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; margin-left: 8px; }
.job-crew { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.job-splits { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Mobile Crew Tracker</h1>
  <div class="sub" id="month-sub">Loading...</div>
  <div class="live"><span class="live-dot"></span> Live view</div>
</header>
<nav>
  <button class="active" onclick="showTab('queue',this)">Rotation</button>
  <button onclick="showTab('rounds',this)">Round Log</button>
  <button onclick="showTab('jobs',this)">Job Log</button>
</nav>
<main>

<div id="tab-queue">
  <div class="card">
    <div class="card-title">Lead rotation</div>
    <div class="round-info">
      <span id="round-progress">Loading...</span>
      <span class="round-badge" id="round-badge">Round 1</span>
    </div>
    <div class="queue-list" id="leads-queue"></div>
    <div class="readonly-notice">Read only — updated in real time by your production manager</div>
  </div>
  <div class="card">
    <div class="card-title">Helpers</div>
    <div class="queue-list" id="helpers-list"></div>
    <div class="readonly-notice">Helpers assigned as needed — no fixed rotation</div>
  </div>
</div>



<div id="tab-rounds" style="display:none;">
  <div class="card">
    <div class="month-label" id="month-label-rounds"></div>
    <div class="card-title">Lead round history</div>
    <div id="round-log"></div>
  </div>
</div>

<div id="tab-jobs" style="display:none;">
  <div class="card">
    <div class="month-label" id="month-label-jobs"></div>
    <div class="card-title">Jobs &amp; rounds this month</div>
    <div class="totals-grid" id="jobs-summary"></div>
  </div>
  <div class="card" style="margin-top:12px;">
    <div class="card-title">Job log — crew and footage</div>
    <div id="jobs-list"></div>
  </div>
</div>

</main>
<script>
const SUPABASE_URL = 'https://nixyuazdwhyjwrbjivdp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5peHl1YXpkd2h5andyYmppdmRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTc0ODEsImV4cCI6MjEwNDM3MzQ4MX0.xOCe6qG37rTTQ7SaQra0BtF4Gbm_qbQMufUfqFBLEgs';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
  global: { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
});

const LEADS = ['David','Richard','Justus','Wayne'];
const HELPERS = ['Daniel','Darnez','Daryl'];
const CREW = { David:'lead', Richard:'lead', Justus:'lead', Wayne:'lead', Daniel:'helper', Darnez:'helper', Daryl:'helper' };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const now = new Date();
const mk = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
const label = MONTHS[now.getMonth()] + ' ' + now.getFullYear();

document.getElementById('month-sub').textContent = 'Gulf Coast Production — ' + label;
['totals','rounds','jobs'].forEach(t => { const el = document.getElementById('month-label-'+t); if(el) el.textContent = label; });

function showTab(tab, btn) {
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.style.display = 'none');
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = '';
  if (btn) btn.classList.add('active');
}

async function loadAll() {
  const [jobsRes, rotRes, roundsRes] = await Promise.all([
    db.from('jobs').select('*, assignments(*)').eq('month_key', mk).order('date', { ascending: false }),
    db.from('rotation').select('*').eq('month_key', mk).eq('role', 'lead'),
    db.from('rounds').select('*').eq('month_key', mk).eq('role', 'lead')
  ]);

  const jobs = jobsRes.data || [];
  const rotData = rotRes.data || [];
  const rounds = roundsRes.data || [];

  let roundAssignments = [];
  if (rounds.length > 0) {
    const { data: ras } = await db.from('round_assignments').select('*').in('round_id', rounds.map(r=>r.id)).order('created_at');
    roundAssignments = ras || [];
  }

  // LEAD QUEUE
  const rotRow = rotData[0];
  const queue = rotRow ? rotRow.queue_order : LEADS;
  const roundNum = rotRow ? (rotRow.current_round || 1) : 1;
  document.getElementById('round-badge').textContent = 'Round ' + roundNum;

  const currentRound = rounds.find(r => r.round_number === roundNum);
  const slotStatus = {};
  if (currentRound) {
    roundAssignments.filter(ra => ra.round_id === currentRound.id).forEach(ra => slotStatus[ra.name] = ra.action);
  }
  const done = Object.keys(slotStatus).length;
  document.getElementById('round-progress').textContent = done + ' of 4 complete this round';

  document.getElementById('leads-queue').innerHTML = queue.map((name, i) => {
    const isNext = i === 0 && !slotStatus[name];
    const action = slotStatus[name];
    let cls = 'queue-item' + (isNext ? ' up-next' : action ? ' done' : '');
    let tag = action === 'assign' ? '<span class="done-tag">Assigned ✓</span>' : action === 'skip' ? '<span class="skip-tag">Skipped</span>' : isNext ? '<span class="next-tag">Next up</span>' : '';
    return `<div class="${cls}"><span class="queue-pos">${i+1}</span><span class="queue-name">${name}</span>${tag}</div>`;
  }).join('');

  // HELPERS LIST — just show job count this month
  const helperCounts = {};
  HELPERS.forEach(h => helperCounts[h] = 0);
  jobs.forEach(j => (j.assignments||[]).forEach(a => { if(helperCounts[a.name]!==undefined) helperCounts[a.name]++; }));
  document.getElementById('helpers-list').innerHTML = HELPERS.map(name => {
    return `<div class="queue-item"><span class="queue-name">${name}</span><span style="font-size:12px;color:var(--text-muted)">${helperCounts[name]} job${helperCounts[name]!==1?'s':''} this month</span></div>`;
  }).join('');

  // TOTALS
  const counts={}, roundsWorked={};
  Object.keys(CREW).forEach(n => { counts[n]=0; roundsWorked[n]=0; });
  jobs.forEach(j => (j.assignments||[]).forEach(a => { if(counts[a.name]!==undefined) counts[a.name]++; }));
  roundAssignments.filter(ra=>ra.action==='assign').forEach(ra=>{ if(roundsWorked[ra.name]!==undefined)roundsWorked[ra.name]++; });



  // JOBS SUMMARY — counts and rounds only
  const summaryEl = document.getElementById('jobs-summary');
  if (summaryEl) {
    summaryEl.innerHTML = [...LEADS, ...HELPERS].map(name => {
      const role = CREW[name];
      const badge = `<span class="role-badge ${role}-badge">${role}</span>`;
      const rw = roundsWorked[name] || 0;
      const jc = counts[name] || 0;
      return `<div class="stat-cell">
        <div class="stat-name">${name}${badge}</div>
        <div class="stat-amount">${jc} job${jc!==1?'s':''}</div>
        <div class="stat-sub">${rw} round${rw!==1?'s':''} worked</div>
      </div>`;
    }).join('');
  }

  // ROUND LOG
  const logEl = document.getElementById('round-log');
  const sortedRounds = [...rounds].sort((a,b)=>a.round_number-b.round_number);
  if (sortedRounds.length===0) { logEl.innerHTML='<div class="empty">No rounds yet</div>'; }
  else logEl.innerHTML = sortedRounds.map(round => {
    const ras = roundAssignments.filter(ra=>ra.round_id===round.id).sort((a,b)=>a.position_in_round-b.position_in_round);
    const entries = ras.map(ra => {
      const cls = ra.action==='assign'?'action-assigned':'action-skip';
      const lbl = ra.action==='assign'?'Assigned':'Skipped';
      const job = ra.job_id ? jobs.find(j=>j.id===ra.job_id) : null;
      const jd = job ? ` · ${job.jobname||'Job'} · $${job.gross.toLocaleString()}` : '';
      const rd = ra.reason ? ` · ${ra.reason}` : '';
      return `<div class="round-entry"><span class="entry-name">${ra.name}</span><div><span class="entry-action ${cls}">${lbl}</span><span class="entry-detail">${jd}${rd}</span></div></div>`;
    }).join('');
    return `<div class="round-group">
      <div class="round-header"><span>Round ${round.round_number}</span><span style="color:var(--text-muted)">${round.completed?'Complete ✓':'In progress'}</span></div>
      ${entries||'<div style="padding:6px 0;font-size:12px;color:var(--text-muted)">No entries yet</div>'}
    </div>`;
  }).join('');

  // JOB LOG
  const list = document.getElementById('jobs-list');
  if (jobs.length===0) { list.innerHTML='<div class="empty">No jobs this month</div>'; return; }
  list.innerHTML = jobs.map(j => {
    const crew=(j.assignments||[]).map(a=>a.name).join(' + ');
    const footage = j.linfeet ? j.linfeet+' ft' : '';
    const ds = j.downspouts ? j.downspouts+' DS' : '';
    const material = [footage, ds].filter(Boolean).join(' · ');
    return `<div class="job-row">
      <div class="job-top"><span class="job-name">${j.jobname||'—'}</span><span style="font-size:12px;color:var(--text-muted);">${material}</span></div>
      <div class="job-crew">${j.date} · ${crew}</div>
    </div>`;
  }).join('');
}

db.channel('crew-v3')
  .on('postgres_changes',{event:'*',schema:'public',table:'jobs'},loadAll)
  .on('postgres_changes',{event:'*',schema:'public',table:'assignments'},loadAll)
  .on('postgres_changes',{event:'*',schema:'public',table:'rotation'},loadAll)
  .on('postgres_changes',{event:'*',schema:'public',table:'round_assignments'},loadAll)
  .subscribe();

loadAll();
</script>
</body>
</html>
